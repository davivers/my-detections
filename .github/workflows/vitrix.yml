name: vitrix

on:
  pull_request:
  push:
    # vitrix/** = branches pushed by the Vitrix UI ("Validate in CI"). The run on that branch is
    # the real CI validation that unlocks "Open pull request" for that exact commit.
    branches: [main, 'vitrix/**']

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0  # full history: rule age for the periodic review check
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      # Installs the commit pinned in requirements-ci.txt. Never install a bare "vitrix" here.
      - name: Install Vitrix
        run: pip install -r requirements-ci.txt

      # Lint, conversion, test cases and the quality gate.
      # The summary shows up in the run's "Summary" tab.
      - name: Validate
        run: vitrix check --strict --gate --markdown "$GITHUB_STEP_SUMMARY"

      - name: Report
        if: always()
        run: vitrix report -o vitrix-report.md || true

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vitrix-report
          path: vitrix-report.md

      - name: Upload the compiled queries
        if: github.event_name == 'push'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/
